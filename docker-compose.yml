services:
  mysql:
    image: mysql:8.0
    container_name: job-platform-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: job_platform_dev
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: jobapp
      MYSQL_PASSWORD: jobapp123
    expose:
      - "3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - job-platform-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: job-platform-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: "jdbc:mysql://mysql:3306/job_platform_dev?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      DB_USERNAME: jobapp
      DB_PASSWORD: jobapp123
      JWT_SECRET: "change-this-to-a-secure-random-string-in-production"
      JWT_EXPIRATION_MS: "86400000"
      AI_API_KEY: ""
      AI_MODEL: "gpt-4o-mini"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"
      MAIL_ENABLED: "${MAIL_ENABLED:-false}"
      MAIL_HOST: "${MAIL_HOST:-}"
      MAIL_PORT: "${MAIL_PORT:-587}"
      MAIL_USERNAME: "${MAIL_USERNAME:-}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
      MAIL_SMTP_AUTH: "${MAIL_SMTP_AUTH:-false}"
      MAIL_SMTP_STARTTLS: "${MAIL_SMTP_STARTTLS:-false}"
      MAIL_FROM: "${MAIL_FROM:-noreply@hireflow.com}"
      MAIL_RESET_URL_BASE: "${MAIL_RESET_URL_BASE:-http://localhost:3000/reset-password}"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - job-platform-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: job-platform-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - job-platform-network

networks:
  job-platform-network:
    driver: bridge

volumes:
  mysql_data: