services:
  - type: web
    name: hireflow-backend
    runtime: java
    plan: free
    rootDir: backend
    buildCommand: "./mvnw package -DskipTests -q"
    startCommand: "java -jar target/job-recruitment-platform-*.jar"
    envVars:
      - key: JAVA_VERSION
        value: "21"
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: "86400000"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: MAIL_ENABLED
        value: "false"
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_SMTP_AUTH
        value: "false"
      - key: MAIL_SMTP_STARTTLS
        value: "false"
      - key: MAIL_FROM
        value: "noreply@hireflow.com"
      - key: MAIL_RESET_URL_BASE
        sync: false
    healthCheckPath: /api/health

  - type: static
    name: hireflow-frontend
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
